name: Jend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Build, tests and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and verification
        run: bash ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t jend:${{ github.sha }} .
